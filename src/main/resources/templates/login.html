<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container auth-shell">
    <section class="card auth-card">
        <h1>Share Management System</h1>
        <p class="muted">Sign in to manage shareholders, portfolio holdings, and transaction records.</p>

        <div class="success" th:if="${param.logout}">You have been logged out successfully.</div>
        <div class="error" th:if="${param.error}">Invalid username or password.</div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div>
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username">
            </div>
            <div>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password">
            </div>
            <button type="submit">Sign In</button>
        </form>

        <div class="hint">
            Default access: <strong>admin</strong> / <strong>admin123</strong>
        </div>
    </section>
</main>
</body>
</html>
