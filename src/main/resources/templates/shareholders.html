<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shareholders</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="nav">
    <div><strong>Share Management System</strong></div>
    <nav>
        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/shareholders}">Shareholders</a>
        <a th:href="@{/transactions}">Transactions</a>
    </nav>
</header>

<main class="container grid two-column">
    <section class="card">
        <h2>Add Shareholder</h2>
        <div class="error" th:if="${serviceError}" th:text="${serviceError}"></div>
        <form th:action="@{/shareholders}" th:object="${shareholderForm}" method="post">
            <div>
                <label for="name">Name</label>
                <input id="name" type="text" th:field="*{name}">
                <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div>
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}">
                <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <button type="submit">Create Shareholder</button>
        </form>
    </section>

    <section class="card">
        <h2>Registered Shareholders</h2>
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="shareholder : ${shareholders}">
                <td th:text="${shareholder.name}">Anika Sharma</td>
                <td th:text="${shareholder.email}">anika@investor.local</td>
            </tr>
            <tr th:if="${#lists.isEmpty(shareholders)}">
                <td colspan="2">No shareholders yet.</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
